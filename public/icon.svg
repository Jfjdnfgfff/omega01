<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A" />
      <stop offset="35%" stop-color="#F5B842" />
      <stop offset="70%" stop-color="#E59819" />
      <stop offset="100%" stop-color="#C57E0E" />
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#D98A10" />
    </linearGradient>
    <linearGradient id="darkOmega" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3f47" />
      <stop offset="50%" stop-color="#282c34" />
      <stop offset="100%" stop-color="#1a1c22" />
    </linearGradient>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow)"/>

  <!-- Subtle Circular Accent Ring -->
  <circle cx="256" cy="210" r="175" fill="none" stroke="#252830" stroke-width="3" opacity="0.6"/>

  <!-- Background Omega Greek Symbol Shape -->
  <g fill="none" stroke="url(#darkOmega)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 130 350 L 175 350 C 170 300, 140 260, 140 205 C 140 135, 190 85, 256 85 C 322 85, 372 135, 372 205 C 372 260, 342 300, 337 350 L 382 350" />
  </g>

  <!-- Central Muscular Bodybuilder & Dumbbells Group -->
  <g filter="url(#goldShadow)" transform="translate(0, -10)">
    <!-- Left Dumbbell -->
    <g transform="translate(75, 165) rotate(-28)">
      <rect x="-18" y="-42" width="36" height="12" rx="4" fill="url(#goldGrad)" />
      <rect x="-14" y="-30" width="28" height="10" rx="3" fill="url(#goldHighlight)" />
      <rect x="-6" y="-20" width="12" height="40" rx="2" fill="#2d2d2d" stroke="url(#goldGrad)" stroke-width="2" />
      <rect x="-14" y="20" width="28" height="10" rx="3" fill="url(#goldHighlight)" />
      <rect x="-18" y="30" width="36" height="12" rx="4" fill="url(#goldGrad)" />
      <!-- Weight ridges -->
      <line x1="-16" y1="-36" x2="16" y2="-36" stroke="#5a3804" stroke-width="2"/>
      <line x1="-16" y1="36" x2="16" y2="36" stroke="#5a3804" stroke-width="2"/>
    </g>

    <!-- Right Dumbbell -->
    <g transform="translate(437, 165) rotate(28)">
      <rect x="-18" y="-42" width="36" height="12" rx="4" fill="url(#goldGrad)" />
      <rect x="-14" y="-30" width="28" height="10" rx="3" fill="url(#goldHighlight)" />
      <rect x="-6" y="-20" width="12" height="40" rx="2" fill="#2d2d2d" stroke="url(#goldGrad)" stroke-width="2" />
      <rect x="-14" y="20" width="28" height="10" rx="3" fill="url(#goldHighlight)" />
      <rect x="-18" y="30" width="36" height="12" rx="4" fill="url(#goldGrad)" />
      <!-- Weight ridges -->
      <line x1="-16" y1="-36" x2="16" y2="-36" stroke="#5a3804" stroke-width="2"/>
      <line x1="-16" y1="36" x2="16" y2="36" stroke="#5a3804" stroke-width="2"/>
    </g>

    <!-- Arms & Shoulders -->
    <!-- Left Arm & Bicep -->
    <path d="M 125 185 C 105 210, 115 250, 155 260 C 185 270, 205 250, 205 225 C 205 200, 180 175, 145 175 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="3"/>
    <path d="M 130 195 C 120 220, 135 240, 160 245" fill="none" stroke="#6b4104" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Arm & Bicep -->
    <path d="M 387 185 C 407 210, 397 250, 357 260 C 327 270, 307 250, 307 225 C 307 200, 332 175, 367 175 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="3"/>
    <path d="M 382 195 C 392 220, 377 240, 352 245" fill="none" stroke="#6b4104" stroke-width="3" stroke-linecap="round"/>

    <!-- Traps & Massive Deltoids -->
    <path d="M 175 190 C 195 160, 220 150, 256 150 C 292 150, 317 160, 337 190 C 355 220, 350 250, 335 270 C 300 280, 275 285, 256 285 C 237 285, 212 280, 177 270 C 162 250, 157 220, 175 190 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="3"/>

    <!-- Chest & Pectorals lines -->
    <path d="M 256 185 L 256 280" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 195 240 C 215 265, 245 265, 256 260 C 267 265, 297 265, 317 240" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 220 C 230 235, 245 235, 256 230 C 267 235, 282 235, 302 220" fill="none" stroke="#6b4104" stroke-width="3" stroke-linecap="round"/>

    <!-- Six-pack Abs & Torso -->
    <path d="M 215 285 C 210 325, 215 350, 225 365 C 240 370, 272 370, 287 365 C 297 350, 302 325, 297 285 Z" fill="url(#goldHighlight)" stroke="#111" stroke-width="3"/>
    <!-- Abdominal cuts -->
    <line x1="256" y1="285" x2="256" y2="360" stroke="#111" stroke-width="3"/>
    <path d="M 230 310 C 245 315, 267 315, 282 310" fill="none" stroke="#6b4104" stroke-width="3"/>
    <path d="M 232 335 C 245 340, 267 340, 280 335" fill="none" stroke="#6b4104" stroke-width="3"/>

    <!-- Fierce Head & Beard -->
    <!-- Hair & Head Outline -->
    <path d="M 235 90 C 245 80, 267 80, 277 90 C 290 102, 292 118, 288 132 C 295 142, 292 155, 285 168 C 275 188, 265 195, 256 195 C 247 195, 237 188, 227 168 C 220 155, 217 142, 224 132 C 220 118, 222 102, 235 90 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="3"/>
    <!-- Aggressive Eyes & Eyebrows -->
    <path d="M 238 128 L 250 133 M 274 128 L 262 133" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <circle cx="246" cy="138" r="2.5" fill="#111"/>
    <circle cx="266" cy="138" r="2.5" fill="#111"/>
    <!-- Intense Beard Texture -->
    <path d="M 230 155 C 240 180, 250 192, 256 192 C 262 192, 272 180, 282 155 C 270 170, 260 172, 256 172 C 252 172, 242 170, 230 155 Z" fill="#111"/>
    <!-- Mouth roar -->
    <ellipse cx="256" cy="150" rx="8" ry="6" fill="#111"/>
    <path d="M 251 148 L 261 148" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Gold Divider Line -->
  <line x1="80" y1="392" x2="432" y2="392" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <!-- OMEGA GYM -->
  <text x="256" y="442" font-family="'Tajawal', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#4B5563" letter-spacing="4" text-anchor="middle">
    OMEGA <tspan fill="url(#goldGrad)">GYM</tspan>
  </text>

  <!-- SALLE DE SPORT ET FITNESS Subtitle -->
  <text x="256" y="475" font-family="'Tajawal', 'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="14.5" fill="url(#goldHighlight)" letter-spacing="3.5" text-anchor="middle">
    SALLE DE SPORT ET FITNESS
  </text>
</svg>