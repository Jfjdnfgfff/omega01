<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>LifeOS — مدير حياتي الذكي</title>
    <meta name="description" content="نظام شخصي لإدارة الحياة: الأهداف، المهام، الوقت، العادات، المشاريع، الأموال والمراجعات." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='system-ui' font-weight='700'>L</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply stored theme before paint to avoid a flash of the wrong theme.
      try {
        var raw = localStorage.getItem('lifeos:prefs');
        var prefs = raw ? JSON.parse(raw) : null;
        var theme = (prefs && prefs.theme) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        if (prefs && prefs.dir) document.documentElement.setAttribute('dir', prefs.dir);
        if (prefs && prefs.lang) document.documentElement.setAttribute('lang', prefs.lang);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
